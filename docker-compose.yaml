services:
  mysql:
    image: mysql:8.4
    container_name: eventhub-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Passwor&1
      MYSQL_DATABASE: eventhub
      MYSQL_USER: eventhub
      MYSQL_PASSWORD: Password&1

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  mysql_data:
