services:
  mysql:
    image: mysql:8.4
    container_name: eventhub-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Passwor&1
      MYSQL_DATABASE: eventhub
      MYSQL_USER: eventhub
      MYSQL_PASSWORD: Password&1

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  web:
      build: .
      container_name: eventhub_web
      restart: unless-stopped
      env_file: .env
      environment:
        DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      ports:
        - "5000:5000"
      volumes:
        - .:/app
      command: sh -c "flask db upgrade && gunicorn -b 0.0.0.0:5000 --reload run:app"
volumes:
  mysql_data:

