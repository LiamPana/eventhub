{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Accedi · EventHub{% endblock %}
{% block content %}
  <h1>Accedi</h1>
  <form method="post" class="form" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.email) }}
    {{ field(form.password) }}
    <label class="check">{{ form.remember }} {{ form.remember.label.text }}</label>
    {{ form.submit(class="btn") }}
  </form>
  <p>Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a></p>
{% endblock %}
